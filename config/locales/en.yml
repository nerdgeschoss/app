    offer:
      message: |-
        Hi %{name},

        We're thrilled to extend an offer for you to join our team as a %{position} at nerdgeschoss! Your skills and experience truly impressed us, and we believe you'll be a fantastic addition to our family.

        To review the compensation associated with the role, please refer to our Human Growth Framework: https://nerdgeschoss.de/handbook/hgf/

        Looking forward to welcoming you aboard!

        Greetings,
        Christian
    position: "%{level} %{role}"
    rejection:
      craft_interview: |-
        Hi %{name},

        Thank you for completing the craft interview for the %{position} position. We were glad to see your work, but we've decided not to move forward this time. We really appreciate the effort you put into this stage.

        We wish you the best of luck in your job search,
        Jens
      interview: |-
        Hi %{name},

        Thank you for your interest in the position and for taking the time to apply. After careful review, we regret to inform you that we will not be progressing with your application to the second interview stage.

        We wish you the best of luck in your job search,
        Jens
      review: |-
        Hi %{name},

        We appreciated the chance to learn about your background and experience. After careful consideration, we've decided not to move forward with your application at this time.

        We encourage you to apply again for future roles that match your skills.

        We wish you all the best in your future endeavors and hope you find a wonderful opportunity soon.

        Warm regards,
        Jens & Christian
